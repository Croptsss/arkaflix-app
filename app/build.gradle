plugins { id 'com.android.application' }
android {
    namespace 'com.arkaflix.tv'
    compileSdk 34
    defaultConfig {
        applicationId 'com.arkaflix.tv'
        minSdk 22
        targetSdk 34
        versionCode 4
        versionName '1.3.0'
    }
    buildTypes {
        // Se firma con la clave de depuración: el APK se puede instalar directamente (no es para Play Store)
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    lint { abortOnError false; checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
